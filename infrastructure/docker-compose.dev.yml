# =============================================================================
# Docker Compose — Development Environment
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: dea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-data_engineer_agent}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_user} -d ${POSTGRES_DB:-data_engineer_agent}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: dea-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Backend (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: dea-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      PYTHONPATH: /app/src
      DAGS_DIR: /app/dags
    ports:
      - "8001:8000"
    volumes:
      - ../backend/src:/app/src:ro
      - ../backend/alembic:/app/alembic:ro
      - ../dags:/app/dags
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # ---------------------------------------------------------------------------
  # pgAdmin (Database Management UI)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dea-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agent.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5051:5050"
    depends_on:
      - postgres

  # ---------------------------------------------------------------------------
  # Apache Airflow (Init, Webserver, Scheduler)
  # ---------------------------------------------------------------------------
  airflow-init:
    image: apache/airflow:2.8.1-python3.11
    container_name: dea-airflow-init
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
    volumes:
      - ../dags:/opt/airflow/dags
      - airflow_data:/opt/airflow
    user: "0:0"
    command: >
      bash -c "
        airflow db init &&
        airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@agent.com --password admin || true
      "

  airflow-webserver:
    image: apache/airflow:2.8.1-python3.11
    container_name: dea-airflow-webserver
    restart: unless-stopped
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
    ports:
      - "8080:8080"
    volumes:
      - ../dags:/opt/airflow/dags
      - airflow_data:/opt/airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver --port 8080

  airflow-scheduler:
    image: apache/airflow:2.8.1-python3.11
    container_name: dea-airflow-scheduler
    restart: unless-stopped
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
    volumes:
      - ../dags:/opt/airflow/dags
      - airflow_data:/opt/airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

  # ---------------------------------------------------------------------------
  # Frontend (Next.js Dashboard)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: infrastructure/docker/frontend.Dockerfile
    container_name: dea-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  airflow_data:
