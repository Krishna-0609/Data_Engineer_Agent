[project]
name = "ai-data-engineer-agent"
version = "0.1.0"
description = "AI Agent capable of creating complete ETL/ELT pipelines from natural language"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12"
authors = [{ name = "AI Data Engineer Agent Team" }]

dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "python-multipart>=0.0.12",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
    "greenlet>=3.1.0",

    # --- Validation / Settings ---
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",

    # --- Security ---
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "bcrypt>=4.2.0,<5.0.0",

    # --- Cache ---
    "redis[hiredis]>=5.2.0,<6.0.0",

    # --- Logging / Observability ---
    "structlog>=24.4.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28.0",

    # --- Data Engineering Runtimes ---
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "boto3>=1.35.0",

    # --- Utilities ---
    "httpx>=0.28.0,<1.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "orjson>=3.10.0,<4.0.0",
    "python-dateutil>=2.9.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    # --- Testing ---
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "httpx>=0.28.0,<1.0.0",
    "factory-boy>=3.3.0,<4.0.0",
    "faker>=33.0.0,<34.0.0",
    "aiosqlite>=0.20.0",

    # --- Linting ---
    "ruff>=0.8.0",
    "mypy>=1.13.0",

    # --- Type Stubs ---
    "types-python-dateutil>=2.9.0",
    "types-redis>=4.6.0",
    "types-passlib>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# =============================================================================
# Ruff
# =============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "S",   # flake8-bandit
    "T20", # flake8-print
    "RUF", # ruff-specific
]
ignore = [
    "S101",  # allow assert in tests
    "S105",  # possible hardcoded password (false positives in config)
    "B008",  # do not perform function calls in argument defaults (needed for Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-v --tb=short"

# =============================================================================
# Mypy
# =============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "jose.*",
    "passlib.*",
]
ignore_missing_imports = true
